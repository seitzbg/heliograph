# Example Heliograph config.
# The target tree resolves by inheritance: a setting (probe, pings, step, params)
# applies to a node and everything under it until a descendant overrides it.
# A node with a `host` becomes a monitored leaf; run with:  smoked -config config.example.yaml

database:
  step: 60s        # base polling interval
  pings: 20        # samples per round

probes:            # probe-instance (probe-level) settings
  FPing: {}          # pings are auto-spread across the round (override with period_ms / timeout_ms)
  TCPConnect: {}
  DNS: {}
  HTTP: {}
  SSH: {}
  IRTT: {}         # needs the irtt binary + an irtt server on the target
  NTP: {}          # SNTP query (UDP/123); per-target `measure` graphs RTT (default) or clock offset; stratum shown as a stat

alerts:            # named alert definitions (attach to targets via `alerts:`)
  loss:            # a matcher-style alert with hysteresis
    type: matcher
    matcher: CheckLoss(l=50,x=2)      # raise after 2 rounds >=50% loss, clear after 2 <50%
    comment: sustained packet loss
    edgetrigger: true                 # notify only on raise/clear transitions
    to: [log]                         # notifier names (log is always available)
    priority: 1                       # 1 = highest; while this fires it inhibits
                                      # lower-priority (higher-number) alerts on the
                                      # same target. Omit/0 = never inhibited.
  slow:            # a pattern-style rtt alert (values in ms)
    type: rtt
    pattern: ">150,>150,>150"
    comment: latency over 150ms for 3 rounds
    edgetrigger: true
    priority: 2                       # lower priority than `loss`: suppressed while
                                      # `loss` is firing on the same target
  # The pattern DSL is a right-anchored shape match, newest sample last:
  #   >0%,*12*,>0%   loss now AND again within the previous 12 samples (`*N*` skips 0..N)
  #   >200,*,==U     rtt over 200ms, any sample, then a fully-lost round (`==U` = unknown)
  #   *              a single arbitrary sample (mandatory slot)
  # `U` (unknown = a lost round's missing rtt median) is valid only on `type: rtt`
  # with == / !=. The SmokePing `S` startup sentinel is not supported.
  flaky:           # recurring loss over roughly the last two hours
    type: loss
    pattern: ">0%,*12*,>0%,*12*,>0%"
    comment: intermittent loss (3 lossy rounds within ~2h)
    edgetrigger: true

targets:
  probe: FPing     # default probe for the whole tree; leaves inherit it
  title: Network
  alerts: [loss]   # every target gets the loss alert unless it overrides

  # A target node (a leaf with `host:`) may set `title:` (a display-name override for its graph
  # header, distinct from its tree-path key; grouping-node titles are not inherited). With the
  # collector started with `-resolve-ips` (or SMOKED_RESOLVE_IPS=1),
  # the graph title also shows the target's IP: a pinned `ip:` if set, else a literal-IP `host`,
  # else the resolved hostname. Example:
  #   my-server:
  #     title: My Server          # header shows "My Server (10.0.0.5)" with -resolve-ips
  #     host: my-server.internal  # still the probe target
  #     ip: 10.0.0.5              # pinned display IP (no DNS needed)
  #
  # Stable identity (`id`): a target's history is stored under a stable `id`, NOT its tree path, so
  # moving or renaming a node in the tree keeps its graph. For targets created or imported through
  # the admin UI/`config import`, the server MINTS this id automatically (an opaque UUID) — you do
  # not write it, and the UI does not expose it for editing. A target defined only in THIS YAML file
  # has no minted id and falls back to its tree path as its identity, so renaming such a target in
  # YAML starts a fresh graph. Federation note: the stable id travels in each vantage's assignment;
  # a remote `smoke-agent` older than this feature keeps reporting data across a move (the hub
  # resolves its current display path back to the id, and disambiguates a reused path by the round's
  # fingerprint). Only a pre-FINGERPRINT agent reporting a REUSED path is ambiguous and pauses until
  # upgrade — so upgrade a vantage's agent before moving or reusing a path it measures. See
  # docs/federation.md ("Stable target identity").
  #
  # Vantages (federation): `vantages:` lists which measurement points probe a target; it inherits
  # down the tree like `alerts`. Unset means `[local]` — the hub probes it itself. Add a remote
  # vantage's name to ALSO measure the target from a `smoke-agent` running elsewhere (another ISP or
  # region), so the dashboard overlays one median line per vantage on the same graph — e.g. comparing
  # the path to a host from two ISPs. The name must match the `smoked vantage add <name>` you register
  # on the hub; onboard the cert bundle and run the agent per docs/federation.md. Example — measure a subtree
  # from both the hub and a remote "nyc" agent (leave the internal-only targets on [local]):
  #   Websites:
  #     vantages: [local, nyc]        # both the hub AND the nyc agent probe these
  #     children:
  #       example.com: { host: example.com }

  children:
    # Leaf names describe the PROBE METHOD, grouped by provider. (These are ICMP pings etc.
    # to a DNS server's IP — not "DNS over ICMP", so they aren't named "DNS".) The compose
    # demo runs with -resolve-ips, so each leaf's IP shows in its graph title (1.1.1.1 here).
    Cloudflare:
      children:
        ICMP (FPing):        # ICMP echo via the fping binary (inherited tree default)
          host: 1.1.1.1
        ICMP (native):       # same host, the native Ping probe — side-by-side ICMP compare
          probe: Ping
          host: 1.1.1.1
        "TCP :443":
          probe: TCPConnect
          host: 1.1.1.1
          params: { port: "443" }
        DNS query:           # the only actual DNS-protocol probe here
          probe: DNS
          host: 1.1.1.1
          params: { lookup: example.com }

    Google:
      children:
        ICMP (FPing):
          host: 8.8.8.8
        ICMP (native):       # same host, the native Ping probe — side-by-side ICMP compare
          probe: Ping
          host: 8.8.8.8
        DNS query:
          probe: DNS
          host: 8.8.8.8
          params: { lookup: example.com }

    Websites:
      probe: HTTP          # this branch defaults to HTTP
      alerts: [loss, slow] # override: these targets get both loss and latency alerts
      alertee: [webhook]   # extra recipient for this subtree, on top of each alert's
                           # own `to` (inherited by children; needs -webhook set)
      children:
        example.com:
          host: example.com
        cloudflare.com:
          host: www.cloudflare.com

    Unreachable:
      children:
        blackhole:
          probe: TCPConnect
          host: 192.0.2.1        # TEST-NET-1: always fails -> triggers the loss alert
          params: { port: "9" }

    Servers:
      probe: SSH           # this branch measures SSH responsiveness
      children:
        github.com:
          host: github.com

    Local:
      children:
        localhost:
          host: 127.0.0.1

    Time:                  # NTP servers (SNTP over UDP/123). `measure` picks the graphed value:
      probe: NTP           #   rtt (default) = query round-trip time, 0-based like any probe
      children:            #   offset        = the server's clock offset (signed, zero baseline;
        local:             #                   the other value + stratum show as panel stats)
          host: 127.0.0.1  # Point at YOUR NTP server (chrony/ntpd). Loopback is a safe default: it
                           # queries nothing external, and reads as loss until you set a real host.
        # Public NTP is opt-in, never a default: the NTP Pool ToS and vendor guidance forbid
        # shipping pool.ntp.org as a default and require infrequent queries (the probe also backs
        # off on a Kiss-o'-Death reply). To monitor a public server, uncomment and keep it gentle —
        # one query per round:
        # cloudflare:
        #   title: Cloudflare NTP
        #   host: time.cloudflare.com
        #   pings: 1
        #   params: { measure: offset }   # graph the clock offset instead of RTT
