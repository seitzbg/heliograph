# One-command bring-up: TimescaleDB + the smoked collector serving the dashboard.
#   docker compose up --build   ->   http://localhost:8087/
#
# Federation (multi-vantage) adds a bundled Caddy reverse proxy behind the
# `federation` profile — it terminates TLS (automatic Let's Encrypt) and serves
# the agent API (/agent/v1/*) by API key + the dashboard behind Basic Auth:
#   cp .env.example .env   # then set DOMAIN + ACME_EMAIL + DASH_PASSWORD_HASH
#   docker compose --profile federation up --build
# The default `docker compose up` above is unchanged and starts no proxy.
services:
  timescaledb:
    # Pinned to a specific release AND digest, so a rebuild can't silently pull a different
    # TimescaleDB (Renovate keeps the digest current — see renovate.json). CODE_REVIEW M4/L7.
    image: timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a
    environment:
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: smoke
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smoke -d smoke"]
      interval: 5s
      timeout: 3s
      retries: 10

  smoked:
    build: .
    # Runs as a non-root user (see Dockerfile); NET_RAW stays in the bounding set
    # so the setcap'd fping can still send ICMP. The server binds 0.0.0.0:8087
    # inside the container — put it behind a reverse proxy / VPN for real exposure
    # (the proxy owns TLS + authentication; the bundled Caddy does NOT rate-limit —
    # add a rate limiter there or upstream if you need one); the port below is
    # published on localhost only.
    cap_add:
      - NET_RAW          # fping ICMP (via fping's file capability, non-root)
    sysctls:
      # Lets the native Ping probe send ICMP via an unprivileged datagram socket
      # (no capability needed) — the socket's GID must fall in this range. 10001 is
      # the collector's GID (see Dockerfile: `adduser -u 10001`). FPing instead uses
      # CAP_NET_RAW (above); the native Ping probe's raw fallback can't help here
      # because the non-root process holds no effective capability, so this range is
      # what makes `probe: Ping` work.
      #
      # Do NOT widen this to "0 2147483647": rootless Podman applies sysctls inside a
      # user namespace that maps only the ~65k GIDs from /etc/subgid, so an out-of-range
      # upper bound is rejected at container start with EINVAL (Docker rootful is fine).
      net.ipv4.ping_group_range: "0 10001"
    environment:
      # Optional: enable the password-gated admin key-management API + Vantages
      # GUI panel. Empty (the default) leaves it fail-closed/disabled. Set it in
      # .env to provision vantages from the browser instead of the CLI.
      SMOKED_ADMIN_PASSWORD: ${SMOKED_ADMIN_PASSWORD:-}
      # The image's default command runs `-serve -addr :8087 -webdir /web`; these env vars drive the
      # rest (config / DSN / downsample), keeping the DB password out of the command list. Each
      # mirrors a -flag on cmd/smoked, and the `vantage`/`import` subcommands already read SMOKED_DSN.
      SMOKED_CONFIG: /etc/heliograph/config.yaml    # baked demo config (multi-probe targets)
      SMOKED_DSN: "postgres://smoke:smoke@timescaledb:5432/smoke?sslmode=disable"
      SMOKED_DOWNSAMPLE: "1"                        # hourly continuous aggregate for the UI's Hourly mode
    ports:
      # Published on localhost only: the API is unauthenticated and query-heavy, so it
      # must not be reachable on all host interfaces. For access beyond this host, run a
      # reverse proxy (TLS + auth; add rate limiting there if you need it) pointed at
      # 127.0.0.1:8087 rather than changing this to 0.0.0.0.
      - "127.0.0.1:8087:8087"
    depends_on:
      timescaledb:
        condition: service_healthy

  # Bundled reverse proxy for federation (opt-in via the `federation` profile).
  # Terminates TLS with an auto-issued, auto-renewed Let's Encrypt cert for
  # $DOMAIN and serves smoked with two auth models (see Caddyfile): /agent/v1/*
  # by per-vantage API key, the dashboard/read/admin API behind HTTP Basic Auth.
  # smoked itself never does TLS (the API key + Basic Auth ride inside Caddy's TLS).
  caddy:
    profiles: ["federation"]
    # Built from Caddy.Dockerfile so DNS-challenge provider plugins are compiled
    # in — the stock image has none. Bundles cloudflare, route53, digitalocean,
    # duckdns, namecheap, gandi; pick one at runtime via CADDY_ACME_DNS.
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP-01 challenge + HTTP->HTTPS redirect (not needed for DNS-01)
      - "443:443"   # public agent API + dashboard over TLS
    environment:
      # From .env (see .env.example). Set DOMAIN=localhost to smoke-test with a
      # self-signed cert instead of hitting Let's Encrypt.
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # HTTP Basic Auth for the dashboard/read API (smoked's read API has no auth
      # of its own). DASH_PASSWORD_HASH is a bcrypt hash from `caddy hash-password`.
      DASH_USER: ${DASH_USER:-admin}
      DASH_PASSWORD_HASH: ${DASH_PASSWORD_HASH}
      # TLS challenge. Empty = HTTP-01. For DNS-01 set CADDY_ACME_DNS to your
      # provider's acme_dns line + its credential var(s); see .env.example.
      CADDY_ACME_DNS: ${CADDY_ACME_DNS:-}
      # Credentials for the bundled DNS providers (only the one you use matters).
      CF_API_TOKEN: ${CF_API_TOKEN:-}                    # cloudflare
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}                  # digitalocean
      DUCKDNS_API_TOKEN: ${DUCKDNS_API_TOKEN:-}          # duckdns
      GANDI_BEARER_TOKEN: ${GANDI_BEARER_TOKEN:-}        # gandi
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY:-}          # namecheap
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER:-}        # namecheap
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}          # route53
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}  # route53
      AWS_REGION: ${AWS_REGION:-}                        # route53
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certs across restarts (LE rate limits)
      - caddy_config:/config
    depends_on:
      - smoked

volumes:
  tsdata: {}
  caddy_data: {}
  caddy_config: {}
