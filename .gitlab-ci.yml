stages:
  - test

# Shared Go job settings (image, runner tag, module cache).
.go-base:
  image: golang:1.26
  tags:
    - ubuntu-26.04-amd64
  variables:
    GOPATH: "$CI_PROJECT_DIR/.gocache"
  cache:
    key: gomod
    paths:
      - .gocache/pkg/mod

go-test:
  extends: .go-base
  stage: test
  before_script:
    - go version
  script:
    # Formatting must be clean (gofmt -l prints files that need formatting).
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - go build ./...
    # Race detector on the full suite (catches data races in the async scheduler,
    # dispatcher, and webhook delivery pool).
    - go test -race ./...
    # go.mod / go.sum must be tidy.
    - go mod tidy
    - git diff --exit-code go.mod go.sum

frontend:
  stage: test
  image: node:22-alpine
  tags:
    - ubuntu-26.04-amd64
  script:
    - node web/dashboard.test.mjs
    - node web/smoke.render.test.mjs

# Dependency vulnerability scan. Needs network to fetch the tool + the vuln DB, so it
# is allowed to fail (informative, non-blocking) rather than red a pipeline on a runner
# without outbound access. The tool is pinned (not @latest) so the scan is reproducible
# — a given commit always runs against the same govulncheck build.
govulncheck:
  extends: .go-base
  stage: test
  allow_failure: true
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - "$GOPATH/bin/govulncheck ./..."

# Integration tests against a real TimescaleDB. Without SMOKE_TEST_DSN the pgstore/vantage
# tests skip (as they do in go-test); this job spins up a TimescaleDB service and runs them.
# allow_failure while the service-readiness is proven in CI — the tests RUN and report, but a
# transient DB-startup flake doesn't red an MR. Tighten to blocking once it's shown stable.
db-test:
  extends: .go-base
  stage: test
  allow_failure: true
  services:
    - name: timescale/timescaledb:2.29.1-pg16
      alias: timescaledb
  variables:
    POSTGRES_DB: smoke
    POSTGRES_USER: smoke
    POSTGRES_PASSWORD: smoke
    SMOKE_TEST_DSN: "postgres://smoke:smoke@timescaledb:5432/smoke?sslmode=disable"
  before_script:
    - go version
    # TimescaleDB restarts once during first-boot init; wait past it before connecting.
    - sleep 20
  script:
    # -p 1 serializes the package test binaries: internal/configstore and cmd/smoked
    # both mutate the single-row `config_fragment` table, so running them concurrently
    # (default -p) races on that row. cmd/smoked's --history e2e test also writes rows
    # into the shared `samples` table, which internal/store/pgstore's tests read/write
    # too — a second reason these packages need to run serialized, not just in parallel
    # with each other. (Same reasons a local `go test ./...` with a DSN can flake — run
    # those packages with -p 1.)
    - go test -p 1 -count=1 ./internal/store/pgstore/ ./internal/vantage/ ./internal/api/ ./internal/configstore/ ./cmd/smoked/
