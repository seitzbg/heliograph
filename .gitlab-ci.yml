stages:
  - test
  - build
  - scan

# Shared Go job settings (image, runner tag, module cache). CI images are digest-pinned for
# reproducible pipelines; Renovate keeps the digests current (see renovate.json). CODE_REVIEW M4/L7.
.go-base:
  image: golang:1.26@sha256:7caba5286b4c3613a337b709c573047d8ae62ee76106647313b61e72b99f20af
  tags:
    - ubuntu-26.04-amd64
  variables:
    GOPATH: "$CI_PROJECT_DIR/.gocache"
  cache:
    key: gomod
    paths:
      - .gocache/pkg/mod

go-test:
  extends: .go-base
  stage: test
  before_script:
    - go version
    # rrdtool: the SmokePing RRD-extraction tests (internal/importer/smokeping)
    # skip without it — without this the most bug-prone importer path (RRA
    # stitching / tier selection) would run in NO CI job (audit M3).
    - apt-get update && apt-get install -y --no-install-recommends rrdtool
  script:
    # Formatting must be clean (gofmt -l prints files that need formatting).
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - go build ./...
    # Race detector on the full suite (catches data races in the async scheduler,
    # dispatcher, and webhook delivery pool).
    - go test -race ./...
    # go.mod / go.sum must be tidy.
    - go mod tidy
    - git diff --exit-code go.mod go.sum

frontend:
  stage: test
  image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
  tags:
    - ubuntu-26.04-amd64
  script:
    - node web/dashboard.test.mjs
    - node web/smoke.render.test.mjs

# Dependency vulnerability scan. BLOCKING (CODE_REVIEW M6): "green CI" must mean the vuln DB was
# actually reached and clean — a scan that can't run is a gap, not a pass, so it reds the pipeline
# rather than being silently ignored. The fleet runner has outbound access. The tool is pinned (not
# @latest) so the scan is reproducible — a given commit always runs against the same govulncheck build.
govulncheck:
  extends: .go-base
  stage: test
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - "$GOPATH/bin/govulncheck ./..."

# Integration tests against a real TimescaleDB (pgstore/vantage/configstore/history-import + the
# DB-backed API). BLOCKING (CODE_REVIEW M6): these carry the highest production risk, so a failure
# must red the pipeline, not skip silently. Readiness is an explicit connect loop (below), not a
# fixed sleep, so making it blocking doesn't introduce startup flakiness.
db-test:
  extends: .go-base
  stage: test
  services:
    - name: timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a
      alias: timescaledb
  variables:
    POSTGRES_DB: smoke
    POSTGRES_USER: smoke
    POSTGRES_PASSWORD: smoke
    SMOKE_TEST_DSN: "postgres://smoke:smoke@timescaledb:5432/smoke?sslmode=disable"
  before_script:
    - go version
    # rrdtool: the `smoked import ... --history` end-to-end tests (cmd/smoked) need both a DB and
    # rrdtool. postgresql-client: pg_isready for the readiness loop below.
    - apt-get update && apt-get install -y --no-install-recommends rrdtool postgresql-client
    # Wait for TimescaleDB to actually accept connections, requiring two consecutive successes so a
    # blip during its first-boot init restart can't slip through, then fail hard if it never came up.
    - |
      ok=0
      for i in $(seq 1 60); do
        if pg_isready -h timescaledb -p 5432 -U smoke -d smoke -q; then
          ok=$((ok+1)); [ "$ok" -ge 2 ] && break
        else
          ok=0
        fi
        echo "waiting for timescaledb (attempt $i, streak $ok)..."; sleep 2
      done
      pg_isready -h timescaledb -p 5432 -U smoke -d smoke
  script:
    # -p 1 serializes the package test binaries: internal/configstore and cmd/smoked
    # both mutate the single-row `config_fragment` table, so running them concurrently
    # (default -p) races on that row. cmd/smoked's --history e2e test also writes rows
    # into the shared `samples` table, which internal/store/pgstore's tests read/write
    # too — a second reason these packages need to run serialized, not just in parallel
    # with each other. (Same reasons a local `go test ./...` with a DSN can flake — run
    # those packages with -p 1.)
    - go test -p 1 -count=1 ./internal/store/pgstore/ ./internal/vantage/ ./internal/api/ ./internal/configstore/ ./cmd/smoked/

# Build the collector image and push it to the GitLab container registry
# (git.fiber.house:5050/munro/smokeping-modern) so the docker hosts can pull it.
# Runs after the test stage, so a red test blocks the image. The fleet runner is
# privileged with the host docker socket bind-mounted into every job, so the
# `docker` CLI talks straight to the host daemon — no docker:dind service needed.
# Builds on any branch push and on tags (a branch pipeline tags the image with
# the branch slug + short SHA, which the ansible stack pulls for a test deploy).
build-image:
  stage: build
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  tags:
    - ubuntu-26.04-amd64
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # --provenance=false drops BuildKit's attestation manifest: GitLab's registry
    # rejects the multi-manifest index it produces ("blob unknown to registry").
    - docker build --provenance=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# SBOM + finished-IMAGE vulnerability scan (go-test's govulncheck only covers the Go module graph,
# not the base image's OS packages). Runs after the image is pushed, via the runner's mounted host
# docker socket. Report-only for now (allow_failure) so introducing it can't red the pipeline on a
# pre-existing base-image CVE — tighten to blocking once the base is clean. On a SCHEDULED pipeline
# it re-scans the current :main image, so a CVE newly disclosed against the pinned (unchanged) images
# is still caught between merges. Tools are version-pinned. CODE_REVIEW M4/L7.
image-scan:
  stage: scan
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  tags:
    - ubuntu-26.04-amd64
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        SCAN_IMAGE: "$CI_REGISTRY_IMAGE:main"
    - if: '$CI_COMMIT_TAG'
      variables:
        SCAN_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - if: '$CI_COMMIT_BRANCH'
      variables:
        SCAN_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$SCAN_IMAGE"
    # SBOM (SPDX JSON) -> artifact.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.19.0 "docker:$SCAN_IMAGE" -o spdx-json > sbom.spdx.json
    # Vulnerability scan of the finished image; reports fixable HIGH/CRITICAL.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$SCAN_IMAGE"
  artifacts:
    paths:
      - sbom.spdx.json
    when: always
    expire_in: 30 days
