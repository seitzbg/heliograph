# CI: test → build → scan, publishing the collector image to GHCR
# (ghcr.io/<owner>/heliograph) so the docker hosts can pull it. Migrated from
# the former GitLab CI (.gitlab-ci.yml) — see docs/CHANGELOG for the git.fiber.house →
# GitHub move.
#
# Runs on GitHub-hosted `ubuntu-latest`. That runner image drifts over time — an accepted
# tradeoff for hosted CI, NOT a reproducibly-pinned job container like the old GitLab model.
# The reproducibility-sensitive inputs are pinned instead: every action is pinned to a commit
# SHA (comment shows the tag), and every image (base, TimescaleDB service, syft/trivy) is pinned
# by digest; Renovate keeps them current.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege DEFAULT: read-only. Package-write is granted narrowly, at job scope, only to the
# publishing job (build-image) — and only its non-PR runs actually push. The test jobs stay read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the SmokePing RRD-extraction tests (internal/importer/smokeping)
      # skip without it — without this the most bug-prone importer path (RRA
      # stitching / tier selection) would run in NO CI job (audit M3).
      - name: Install rrdtool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rrdtool
      # Formatting must be clean (gofmt -l prints files that need formatting).
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # Race detector on the full suite (catches data races in the async scheduler,
      # dispatcher, and webhook delivery pool).
      - name: go test -race
        run: go test -race ./...
      # go.mod / go.sum must be tidy.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node web/dashboard.test.mjs
      - run: node web/smoke.render.test.mjs

  # Dependency vulnerability scan. BLOCKING (CODE_REVIEW M6): "green CI" must mean the vuln DB was
  # actually reached and clean — a scan that can't run is a gap, not a pass, so it reds the pipeline
  # rather than being silently ignored. The tool is pinned (not @latest) so the scan is reproducible.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  # Integration tests against a real TimescaleDB (pgstore/vantage/configstore/history-import + the
  # DB-backed API). BLOCKING (CODE_REVIEW M6): these carry the highest production risk, so a failure
  # must red the pipeline, not skip silently.
  db-test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a
        env:
          POSTGRES_DB: smoke
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 40
    env:
      SMOKE_TEST_DSN: postgres://smoke:smoke@localhost:5432/smoke?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the `smoked import ... --history` end-to-end tests (cmd/smoked) need both a DB and
      # rrdtool. postgresql-client: pg_isready for the readiness re-check below.
      - name: Install rrdtool + psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rrdtool postgresql-client
      # The service is gated healthy by Docker, but timescaledb restarts once during its first-boot
      # init. Require two consecutive connects so a blip during that restart can't slip through.
      - name: Wait for TimescaleDB
        run: |
          ok=0
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U smoke -d smoke -q; then
              ok=$((ok+1)); [ "$ok" -ge 2 ] && break
            else
              ok=0
            fi
            echo "waiting for timescaledb (attempt $i, streak $ok)..."; sleep 2
          done
          pg_isready -h localhost -p 5432 -U smoke -d smoke
      # -p 1 serializes the package test binaries: internal/configstore and cmd/smoked both mutate
      # the single-row config_fragment table, and cmd/smoked's --history e2e writes rows into the
      # shared samples table that pgstore's tests also touch — so these packages must run serialized.
      - name: Integration tests
        run: go test -p 1 -count=1 ./internal/store/pgstore/ ./internal/vantage/ ./internal/api/ ./internal/configstore/ ./cmd/smoked/

  # Build the collector image and push it to GHCR so the docker hosts can pull it. Runs only after
  # every test job is green, so a red test blocks the image. Builds on all triggers; PUSHES only on
  # non-PR events (push to main / tags) so PRs verify the Docker build without publishing. Also runs
  # the SBOM + finished-image vuln scan here against the locally loaded image (go-test's govulncheck
  # only covers the Go module graph, not the base image's OS packages).
  build-image:
    needs: [go-test, frontend, govulncheck, db-test]
    runs-on: ubuntu-latest
    # The ONLY job granted package write — and only its non-PR runs actually push (see the login +
    # build steps). PR runs build/scan without a token that can publish.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=short
      - name: Build (+push on non-PR)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # single-arch amd64; provenance off keeps a plain single manifest (matches what the
          # docker hosts pull) and lets `load` import it locally for the scan below.
          provenance: false
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # SBOM (SPDX JSON) of the built image -> artifact. Scanner images are digest-pinned.
      - name: SBOM (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a "docker:ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            -o spdx-json > sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
      # Vulnerability scan of the finished image; reports fixable HIGH/CRITICAL. Report-only for now
      # (continue-on-error) so a pre-existing base-image CVE can't red the pipeline — tighten to
      # blocking once the base is clean. The scheduled image-scan.yml re-runs this against :main.
      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
