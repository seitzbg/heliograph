# CI: test → build → scan, publishing the collector image to GHCR
# (ghcr.io/<owner>/heliograph) so the docker hosts can pull it. Migrated from
# the former GitLab CI (.gitlab-ci.yml) — see docs/CHANGELOG for the git.fiber.house →
# GitHub move.
#
# Runs on GitHub-hosted `ubuntu-latest`. That runner image drifts over time — an accepted
# tradeoff for hosted CI, NOT a reproducibly-pinned job container like the old GitLab model.
# The reproducibility-sensitive inputs are pinned instead: every action is pinned to a commit
# SHA (comment shows the tag), and every image (base, TimescaleDB service, syft/trivy) is pinned
# by digest; Renovate keeps them current.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege DEFAULT: read-only. Package-write is granted narrowly, at job scope, only to the
# publishing job (build-image) — and only its non-PR runs actually push. The test jobs stay read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the SmokePing RRD-extraction tests (internal/importer/smokeping)
      # skip without it — without this the most bug-prone importer path (RRA
      # stitching / tier selection) would run in NO CI job (audit M3).
      - name: Install rrdtool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rrdtool
      # Guard the Trivy allowlist format (CODE_REVIEW L4): every real entry must carry expired_at, so
      # a vuln suppression can never linger silently, and the legacy flat-file `exp:` pseudo-syntax
      # (which Trivy silently ignores) must not creep back in. Comments/examples are excluded.
      - name: Lint .trivyignore.yaml
        run: |
          body=$(grep -vE '^\s*#' .trivyignore.yaml || true)
          ids=$(printf '%s\n' "$body" | grep -cE '^\s*-\s*id:' || true)
          exps=$(printf '%s\n' "$body" | grep -cE '^\s*expired_at:' || true)
          if [ "$ids" != "$exps" ]; then
            echo "each .trivyignore.yaml entry needs an expired_at (found $ids id: vs $exps expired_at:)"; exit 1
          fi
          if printf '%s\n' "$body" | grep -qE '\bexp:[0-9]'; then
            echo "use 'expired_at:' (Trivy YAML), not the legacy flat-file 'exp:' which Trivy ignores"; exit 1
          fi
          echo ".trivyignore.yaml ok ($ids expiring exception(s))"
      # Formatting must be clean (gofmt -l prints files that need formatting).
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # Race detector on the full suite (catches data races in the async scheduler,
      # dispatcher, and webhook delivery pool).
      - name: go test -race
        run: go test -race ./...
      # go.mod / go.sum must be tidy.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node web/dashboard.test.mjs
      - run: node web/smoke.render.test.mjs

  # Dependency vulnerability scan. BLOCKING (CODE_REVIEW M6): "green CI" must mean the vuln DB was
  # actually reached and clean — a scan that can't run is a gap, not a pass, so it reds the pipeline
  # rather than being silently ignored. The tool is pinned (not @latest) so the scan is reproducible.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  # Integration tests against a real TimescaleDB (pgstore/vantage/configstore/history-import + the
  # DB-backed API). BLOCKING (CODE_REVIEW M6): these carry the highest production risk, so a failure
  # must red the pipeline, not skip silently.
  db-test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a
        env:
          POSTGRES_DB: smoke
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d smoke"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 40
    env:
      SMOKE_TEST_DSN: postgres://smoke:smoke@localhost:5432/smoke?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the `smoked import ... --history` end-to-end tests (cmd/smoked) need both a DB and
      # rrdtool. postgresql-client: pg_isready for the readiness re-check below.
      - name: Install rrdtool + psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rrdtool postgresql-client
      # The service is gated healthy by Docker, but timescaledb restarts once during its first-boot
      # init. Require two consecutive connects so a blip during that restart can't slip through.
      - name: Wait for TimescaleDB
        run: |
          ok=0
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U smoke -d smoke -q; then
              ok=$((ok+1)); [ "$ok" -ge 2 ] && break
            else
              ok=0
            fi
            echo "waiting for timescaledb (attempt $i, streak $ok)..."; sleep 2
          done
          pg_isready -h localhost -p 5432 -U smoke -d smoke
      # -p 1 serializes the package test binaries: internal/configstore and cmd/smoked both mutate
      # the single-row config_fragment table, and cmd/smoked's --history e2e writes rows into the
      # shared samples table that pgstore's tests also touch — so these packages must run serialized.
      - name: Integration tests
        run: go test -p 1 -count=1 ./internal/store/pgstore/ ./internal/vantage/ ./internal/api/ ./internal/configstore/ ./cmd/smoked/

  # Build the collector image ONCE, as an OCI archive, then SBOM + vuln-scan that exact artifact.
  # This is the single source of truth: publish-image pushes these same bytes unchanged, so the
  # digest that receives the tags + provenance attestation is byte-for-byte the one that was scanned
  # here (CODE_REVIEW M1 — the previous design built a second time in publish-image, so the scan
  # gated a different build than the one published). Runs on all triggers after every test job is
  # green, with a READ-ONLY token: a PR build exercises the whole build→scan path but can NEVER
  # publish (that is the separate, write-scoped, non-PR `publish-image` job below). The archive +
  # its digest are handed to publish-image via workflow artifacts on non-PR runs.
  build-image:
    needs: [go-test, frontend, govulncheck, db-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # full history + tags, so `git describe` below finds the real nearest tag
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=heliograph
      # Baked into the binary via main.version (CODE_REVIEW M8) so `smoked -version` / `smoke-agent
      # -version` reports something meaningful instead of the hard-coded "dev" default.
      - name: Compute version
        id: ver
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Build once -> OCI archive (single source of truth; never pushed here)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # single-arch amd64; provenance off keeps a plain single manifest (matches what the docker
          # hosts pull). type=oci writes a self-contained archive we scan here and push verbatim from
          # publish-image via skopeo, so the scanned bytes == the published bytes. Cache shared with publish.
          provenance: false
          push: false
          outputs: type=oci,dest=/tmp/collector-image.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-to: type=gha,mode=max
          cache-from: type=gha
      # The archive's own manifest digest, read straight from its OCI index — this is what skopeo
      # preserves on push, so publish-image asserts the pushed digest equals it (CODE_REVIEW M1).
      - name: Record image digest
        id: digest
        run: |
          d=$(tar -xOf /tmp/collector-image.tar index.json | jq -r '.manifests[0].digest')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "$d" > image-digest.txt
          echo "built + scanning image digest: $d"
      # SBOM (SPDX JSON) of the exact archive -> artifact, named with the digest so it is auditably
      # tied to the published image. Scanner images are digest-pinned.
      - name: SBOM (syft)
        run: |
          docker run --rm -v /tmp:/tmp \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a oci-archive:/tmp/collector-image.tar \
            -o spdx-json > sbom.spdx.json
      - name: Upload SBOM + digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: |
            sbom.spdx.json
            image-digest.txt
          retention-days: 30
      # BLOCKING finished-image scan of the archive: the base is CVE-clean as of this change, so a
      # newly-disclosed fixable HIGH/CRITICAL against the pinned base now reds CI — bump the base pin,
      # or add a time-bound exception to .trivyignore.yaml. The scheduled image-scan.yml re-runs this
      # against :main.
      - name: Trivy image scan (blocking)
        run: |
          docker run --rm -v /tmp:/tmp \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" -e TRIVY_IGNOREFILE=/.trivyignore.yaml \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --input /tmp/collector-image.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Hand the SCANNED archive to publish-image so it pushes the exact bytes (non-PR only; a PR
      # never publishes, so it needs no artifact).
      - name: Upload image archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collector-image
          path: /tmp/collector-image.tar
          retention-days: 1

  # Publish the collector image to GHCR + attach a signed build-provenance attestation (a verifiable
  # source-ref -> image-digest mapping). NON-PR ONLY, and the ONLY job with write scopes — so the PR
  # build above never holds a token that can publish. It does NOT rebuild: it pushes the exact OCI
  # archive build-image scanned (via skopeo, which preserves the manifest digest), and asserts the
  # pushed digest equals the scanned digest before attesting — so the scan, the tags, and the
  # attestation all describe one and the same image (CODE_REVIEW M1).
  publish-image:
    needs: [build-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the scanned image archive + digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{collector-image,sbom-spdx}'
          path: /tmp/artifacts
          merge-multiple: true
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      # Push the SCANNED bytes verbatim to every release tag. skopeo copies the OCI archive without
      # re-building or re-compressing, so the registry manifest digest matches the archive's.
      - name: Push scanned archive to all tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while read -r tag; do
            [ -z "$tag" ] && continue
            echo "pushing $tag"
            skopeo copy --all "oci-archive:/tmp/artifacts/collector-image.tar" "docker://$tag"
          done
      # Assert the published digest is EXACTLY the one build-image scanned — the gate that ties the
      # blocking scan to the released artifact (CODE_REVIEW M1). Any mismatch fails the release.
      - name: Verify published digest == scanned digest
        id: digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          scanned=$(cat /tmp/artifacts/image-digest.txt)
          first_tag=$(printf '%s\n' "$TAGS" | head -n1)
          pushed=$(skopeo inspect --format '{{.Digest}}' "docker://$first_tag")
          echo "scanned=$scanned pushed=$pushed"
          if [ "$scanned" != "$pushed" ]; then
            echo "::error::published digest $pushed != scanned digest $scanned — the released image was not the scanned one"; exit 1
          fi
          echo "digest=$pushed" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Build the bundled Caddy reverse-proxy image (Caddy.Dockerfile: xcaddy + DNS-provider plugins), so
  # a broken plugin pin or Dockerfile is caught in CI, and scan it. Not published (the federation
  # profile builds it locally). BLOCKING (CODE_REVIEW M2): the Trivy scan reds the pipeline on any
  # fixable HIGH/CRITICAL, same as the collector's finished-image scan below.
  caddy-image:
    needs: [go-test, frontend, govulncheck, db-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Caddy image (load, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Caddy.Dockerfile
          provenance: false
          load: true
          push: false
          tags: heliograph-caddy:ci
          cache-to: type=gha,mode=max,scope=caddy
          cache-from: type=gha,scope=caddy
      - name: SBOM (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a docker:heliograph-caddy:ci \
            -o spdx-json > sbom-caddy.spdx.json
      - name: Upload Caddy SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-caddy-spdx
          path: sbom-caddy.spdx.json
          retention-days: 30
      - name: Trivy image scan (blocking)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" -e TRIVY_IGNOREFILE=/.trivyignore.yaml \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 heliograph-caddy:ci
