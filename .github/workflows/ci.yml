# CI: test → build → scan, publishing the collector image to GHCR
# (ghcr.io/<owner>/heliograph) so the docker hosts can pull it. Migrated from
# the former GitLab CI (.gitlab-ci.yml) — see docs/CHANGELOG for the git.fiber.house →
# GitHub move.
#
# Runs on GitHub-hosted `ubuntu-latest`. That runner image drifts over time — an accepted
# tradeoff for hosted CI, NOT a reproducibly-pinned job container like the old GitLab model.
# The reproducibility-sensitive inputs are pinned instead: every action is pinned to a commit
# SHA (comment shows the tag), and every image (base, TimescaleDB service, syft/trivy) is pinned
# by digest; Renovate keeps them current.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least-privilege DEFAULT: read-only. Package-write is granted narrowly, at job scope, only to the
# publishing job (publish-image) — and only its non-PR runs actually push. The test jobs stay read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    # Fail fast on a wedged step (e.g. a stalled apt mirror) instead of hanging to GitHub's 6-hour
    # default. Normal run is ~3 min; the ceiling only trips on an infra stall.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the SmokePing RRD-extraction tests (internal/importer/smokeping)
      # skip without it — without this the most bug-prone importer path (RRA
      # stitching / tier selection) would run in NO CI job (audit M3).
      - name: Install rrdtool
        # Retry the apt install: GitHub's package mirrors intermittently stall, which used to hang the
        # job to the 6-hour timeout. Three attempts with backoff (plus apt's own Acquire::Retries) turns
        # a transient mirror blip into a brief wait; only a persistent failure reds the job.
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get install -y --no-install-recommends rrdtool; then ok=1; break; fi
            echo "apt attempt $i failed; retrying in 15s..."; sleep 15
          done
          [ "$ok" = 1 ]
      # Guard the Trivy allowlist format (CODE_REVIEW L4): every real entry must carry expired_at, so
      # a vuln suppression can never linger silently, and the legacy flat-file `exp:` pseudo-syntax
      # (which Trivy silently ignores) must not creep back in. Comments/examples are excluded.
      - name: Lint .trivyignore.yaml
        run: |
          body=$(grep -vE '^\s*#' .trivyignore.yaml || true)
          ids=$(printf '%s\n' "$body" | grep -cE '^\s*-\s*id:' || true)
          exps=$(printf '%s\n' "$body" | grep -cE '^\s*expired_at:' || true)
          if [ "$ids" != "$exps" ]; then
            echo "each .trivyignore.yaml entry needs an expired_at (found $ids id: vs $exps expired_at:)"; exit 1
          fi
          if printf '%s\n' "$body" | grep -qE '\bexp:[0-9]'; then
            echo "use 'expired_at:' (Trivy YAML), not the legacy flat-file 'exp:' which Trivy ignores"; exit 1
          fi
          echo ".trivyignore.yaml ok ($ids expiring exception(s))"
      # Formatting must be clean (gofmt -l prints files that need formatting).
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # Race detector on the full suite (catches data races in the async scheduler,
      # dispatcher, and webhook delivery pool).
      - name: go test -race
        run: go test -race ./...
      # go.mod / go.sum must be tidy.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # pure Node unit tests; normally <1 min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node web/dashboard.test.mjs
      - run: node web/smoke.render.test.mjs

  # Browser-layout regression test. The DOM-less `frontend` unit tests can only check the CSS
  # strings the dashboard generates, not how they lay out — a phone-width horizontal-overflow bug
  # shipped once past them (see CHANGELOG 1.0.3 + its follow-up). This job renders the real
  # dashboard against the demo collector in headless Chromium and asserts the Graphs view does not
  # overflow narrow viewports. Needs Go (to serve) and a browser, so it is its own job.
  layout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Chromium download can be slow; normal run is ~2 min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build smoked
        run: go build -o smoked ./cmd/smoked
      - name: Install Playwright + Chromium
        # Retry: the Chromium download (and its apt deps via --with-deps) intermittently stalls on
        # GitHub's mirrors — the same class of hang the job timeout now caps. Backoff turns a blip
        # into a brief wait; a persistent failure still reds the job.
        run: |
          ok=0
          for i in 1 2 3; do
            if npm ci && npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright install attempt $i failed; retrying in 20s..."; sleep 20
          done
          [ "$ok" = 1 ]
      - name: Layout regression test
        run: SMOKED_BIN=./smoked node web/layout.test.mjs

  # Dependency vulnerability scan. BLOCKING (CODE_REVIEW M6): "green CI" must mean the vuln DB was
  # actually reached and clean — a scan that can't run is a gap, not a pass, so it reds the pipeline
  # rather than being silently ignored. The tool is pinned (not @latest) so the scan is reproducible.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...

  # Integration tests against a real TimescaleDB (pgstore/vantage/configstore/history-import + the
  # DB-backed API). BLOCKING (CODE_REVIEW M6): these carry the highest production risk, so a failure
  # must red the pipeline, not skip silently.
  db-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # apt + TimescaleDB boot + serialized integration suite; normally ~3 min
    env:
      SMOKE_TEST_DSN: postgres://smoke:smoke@localhost:5432/smoke?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no job pushes via git; don't leave GITHUB_TOKEN in .git/config
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # rrdtool: the `smoked import ... --history` end-to-end tests (cmd/smoked) need both a DB and
      # rrdtool. postgresql-client: pg_isready for the readiness re-check below.
      - name: Install rrdtool + psql client
        # Retry the apt install (stalled mirrors were the recurring db-test hang; see go-test above).
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get install -y --no-install-recommends rrdtool postgresql-client; then ok=1; break; fi
            echo "apt attempt $i failed; retrying in 15s..."; sleep 15
          done
          [ "$ok" = 1 ]
      # Run TimescaleDB as a manual container (not a GH Actions service) so we can pass
      # `-c timescaledb.max_background_workers=0`. GH services can't override the container command,
      # and that setting is startup-only (not reloadable). With no background worker the retention /
      # cagg-refresh POLICIES that EnableDownsampling installs never AUTO-fire mid-suite — otherwise
      # the 30-day retention job can drop a test's intentionally old-dated (pre-retention-window)
      # rows between insert and read, a rare cross-test timing flake. The suite refreshes aggregates
      # only via FOREGROUND `CALL refresh_continuous_aggregate`, so bgw=0 is functionally complete
      # (verified: the whole pgstore suite passes against a bgw=0 TimescaleDB). Digest-pinned as before.
      - name: Start TimescaleDB (background workers disabled)
        run: |
          docker run -d --name tsdb \
            -e POSTGRES_DB=smoke -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke \
            -p 5432:5432 \
            timescale/timescaledb:2.29.1-pg16@sha256:252a443e2936039b83dd8da1373d01e59e932d1054fa6adf1bc061f1d56ae60a \
            -c timescaledb.max_background_workers=0
      # timescaledb restarts once during its first-boot init. Require two consecutive connects so a
      # blip during that restart can't slip through.
      - name: Wait for TimescaleDB
        run: |
          ok=0
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U smoke -d smoke -q; then
              ok=$((ok+1)); [ "$ok" -ge 2 ] && break
            else
              ok=0
            fi
            echo "waiting for timescaledb (attempt $i, streak $ok)..."; sleep 2
          done
          pg_isready -h localhost -p 5432 -U smoke -d smoke
      # -p 1 serializes the package test binaries: internal/configstore and cmd/smoked both mutate
      # the single-row config_fragment table, and cmd/smoked's --history e2e writes rows into the
      # shared samples table that pgstore's tests also touch — so these packages must run serialized.
      - name: Integration tests
        run: go test -p 1 -count=1 ./internal/store/pgstore/ ./internal/vantage/ ./internal/api/ ./internal/configstore/ ./cmd/smoked/

  # Build the collector image ONCE, as an OCI archive, then SBOM + vuln-scan that exact artifact.
  # This is the single source of truth: publish-image pushes these same bytes unchanged, so the
  # digest that receives the tags + provenance attestation is byte-for-byte the one that was scanned
  # here (CODE_REVIEW M1 — the previous design built a second time in publish-image, so the scan
  # gated a different build than the one published). Runs on all triggers after every test job is
  # green, with a READ-ONLY token: a PR build exercises the whole build→scan path but can NEVER
  # publish (that is the separate, write-scoped, non-PR `publish-image` job below). The archive +
  # its digest are handed to publish-image via workflow artifacts on non-PR runs.
  build-image:
    needs: [go-test, frontend, govulncheck, db-test, layout-test]
    runs-on: ubuntu-latest
    timeout-minutes: 25   # buildx + syft SBOM + blocking Trivy scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # full history + tags, so `git describe` below finds the real nearest tag
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=heliograph
      # Baked into the binary via main.version (CODE_REVIEW M8) so `smoked -version` / `smoke-agent
      # -version` reports something meaningful instead of the hard-coded "dev" default.
      - name: Compute version
        id: ver
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      - name: Build once -> OCI archive (single source of truth; never pushed here)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # single-arch amd64; provenance off keeps a plain single manifest (matches what the docker
          # hosts pull). type=oci writes a self-contained archive we scan here and push verbatim from
          # publish-image via skopeo, so the scanned bytes == the published bytes. Cache shared with publish.
          provenance: false
          push: false
          outputs: type=oci,dest=/tmp/collector-image.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-to: type=gha,mode=max
          cache-from: type=gha
      # The archive's own manifest digest, read straight from its OCI index — this is what skopeo
      # preserves on push, so publish-image asserts the pushed digest equals it (CODE_REVIEW M1).
      - name: Record image digest
        id: digest
        run: |
          d=$(tar -xOf /tmp/collector-image.tar index.json | jq -r '.manifests[0].digest')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "$d" > image-digest.txt
          echo "built + scanning image digest: $d"
      # SBOM (SPDX JSON) of the exact archive -> artifact, named with the digest so it is auditably
      # tied to the published image. Scanner images are digest-pinned.
      - name: SBOM (syft)
        run: |
          docker run --rm -v /tmp:/tmp \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a oci-archive:/tmp/collector-image.tar \
            -o spdx-json > sbom.spdx.json
      - name: Upload SBOM + digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: |
            sbom.spdx.json
            image-digest.txt
          retention-days: 30
      # BLOCKING finished-image scan of the archive: the base is CVE-clean as of this change, so a
      # newly-disclosed fixable HIGH/CRITICAL against the pinned base now reds CI — bump the base pin,
      # or add a time-bound exception to .trivyignore.yaml. The scheduled image-scan.yml re-runs this
      # against :main.
      - name: Trivy image scan (blocking)
        run: |
          # trivy --input reads a docker-archive tarball or an OCI *directory* (it stats
          # <input>/index.json), NOT an OCI-layout tarball — which is what buildx type=oci writes.
          # Unpack the exact archive to a layout dir and scan that, so the scanned bytes are the
          # same ones publish-image pushes.
          mkdir -p /tmp/oci-layout && tar -xf /tmp/collector-image.tar -C /tmp/oci-layout
          docker run --rm -v /tmp/oci-layout:/oci-layout:ro \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" -e TRIVY_IGNOREFILE=/.trivyignore.yaml \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --input /oci-layout \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      # Hand the SCANNED archive to publish-image so it pushes the exact bytes (non-PR only; a PR
      # never publishes, so it needs no artifact).
      - name: Upload image archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collector-image
          path: /tmp/collector-image.tar
          retention-days: 1

  # Publish the collector image to GHCR + attach a signed build-provenance attestation (a verifiable
  # source-ref -> image-digest mapping). NON-PR ONLY, and the ONLY job with write scopes — so the PR
  # build above never holds a token that can publish. It does NOT rebuild: it pushes the exact OCI
  # archive build-image scanned. Skopeo is required to preserve its digest into a staging tag,
  # which is verified and attested, then addressed immutably by digest BEFORE any public branch /
  # release / SHA alias is changed. Every promoted tag is individually preservation-gated and
  # verified, so the scan, every tag, and the attestation describe one image (CODE_REVIEW M1/M4).
  publish-image:
    needs: [build-image]
    if: github.event_name != 'pull_request'
    # Workflow-level concurrency is per ref, so a main build and tag build can overlap. Serialize
    # only the publishing jobs globally: this makes one reusable candidate tag race-free without
    # delaying their read-only build/test/scan jobs or accumulating a staging tag per run.
    concurrency:
      group: heliograph-publish-image
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20   # skopeo stage/promote + attestation; a stuck registry shouldn't hang for hours
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the scanned image archive + digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{collector-image,sbom-spdx}'
          path: /tmp/artifacts
          merge-multiple: true
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            # :latest tracks the default-branch head (a continuous alias of :main), and a release
            # tag push also refreshes it so :latest carries the clean vX.Y.Z build version right
            # after a release (a git-describe on `main` runs before the tag exists, so a main-only
            # :latest would lag one version). Any non-PR event (main push or v* tag) moves it; a PR
            # build never does.
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install skopeo
        # Retry the apt install (stalled mirrors were the recurring hang; see go-test above).
        run: |
          ok=0
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && \
               sudo apt-get install -y --no-install-recommends skopeo; then ok=1; break; fi
            echo "apt attempt $i failed; retrying in 15s..."; sleep 15
          done
          [ "$ok" = 1 ]
      # First copy to the reusable candidate tag. The publish-image concurrency group above makes
      # that mutable tag exclusive across branch/tag runs. --preserve-digests makes conversion or
      # recompression a hard failure, and this check happens before any public alias is touched.
      - name: Stage and verify scanned image
        id: candidate
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          CANDIDATE: ghcr.io/${{ github.repository }}:candidate
        run: |
          scanned=$(tr -d '\n' < /tmp/artifacts/image-digest.txt)
          skopeo copy --all --preserve-digests --digestfile /tmp/candidate-digest.txt \
            "oci-archive:/tmp/artifacts/collector-image.tar" "docker://$CANDIDATE"
          copied=$(tr -d '\n' < /tmp/candidate-digest.txt)
          staged=$(skopeo inspect --format '{{.Digest}}' "docker://$CANDIDATE")
          echo "scanned=$scanned copied=$copied staged=$staged"
          if [ "$copied" != "$scanned" ] || [ "$staged" != "$scanned" ]; then
            echo "::error::candidate digest differs from scanned digest $scanned; release aliases were not changed"; exit 1
          fi
          echo "ref=$IMAGE@$scanned" >> "$GITHUB_OUTPUT"
          echo "digest=$scanned" >> "$GITHUB_OUTPUT"
      # Attest the verified immutable candidate before release aliases move. If attestation fails,
      # no branch/release/SHA tag has changed; if a later promotion fails part-way, every tag that
      # did move still points to this already-attested digest.
      - name: Attest verified candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
      # Promote only from the verified registry candidate. Each destination copy must preserve the
      # digest and each resulting tag is inspected, so no later tag can silently diverge from the
      # artifact that passed the blocking scan.
      - name: Promote verified candidate to all tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE: ${{ steps.candidate.outputs.ref }}
          SCANNED: ${{ steps.candidate.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "promoting $CANDIDATE -> $tag"
            skopeo copy --all --preserve-digests --digestfile /tmp/tag-digest.txt \
              "docker://$CANDIDATE" "docker://$tag"
            copied=$(tr -d '\n' < /tmp/tag-digest.txt)
            pushed=$(skopeo inspect --format '{{.Digest}}' "docker://$tag")
            echo "tag=$tag copied=$copied pushed=$pushed"
            if [ "$copied" != "$SCANNED" ] || [ "$pushed" != "$SCANNED" ]; then
              echo "::error::$tag digest differs from scanned digest $SCANNED"; exit 1
            fi
          done <<< "$TAGS"

  # Build the bundled Caddy reverse-proxy image (Caddy.Dockerfile: xcaddy + DNS-provider plugins), so
  # a broken plugin pin or Dockerfile is caught in CI, and scan it. Not published (the federation
  # profile builds it locally). BLOCKING (CODE_REVIEW M2): the Trivy scan reds the pipeline on any
  # fixable HIGH/CRITICAL, same as the collector's finished-image scan below.
  caddy-image:
    needs: [go-test, frontend, govulncheck, db-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20   # xcaddy build + syft SBOM + blocking Trivy scan
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Caddy image (load, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Caddy.Dockerfile
          provenance: false
          load: true
          push: false
          tags: heliograph-caddy:ci
          cache-to: type=gha,mode=max,scope=caddy
          cache-from: type=gha,scope=caddy
      - name: SBOM (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a docker:heliograph-caddy:ci \
            -o spdx-json > sbom-caddy.spdx.json
      - name: Upload Caddy SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-caddy-spdx
          path: sbom-caddy.spdx.json
          retention-days: 30
      - name: Trivy image scan (blocking)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" -e TRIVY_IGNOREFILE=/.trivyignore.yaml \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 heliograph-caddy:ci
