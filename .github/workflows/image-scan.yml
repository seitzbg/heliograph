# Scheduled re-scan of the published :main image, so a CVE newly disclosed against the pinned
# (unchanged) base images is still caught between merges. Report-only (continue-on-error) — it
# surfaces findings without failing on a pre-existing base-image CVE. Can also be run on demand.
name: image-scan

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan-main:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull :main
        run: docker pull "ghcr.io/${{ github.repository }}:main"
      - name: SBOM (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.19.0@sha256:bc1ae555a43011d23bb011a4f50e175fc9a5984a008a3f8f2d692b211fcacd2a "docker:ghcr.io/${{ github.repository }}:main" \
            -o spdx-json > sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx-main
          path: sbom.spdx.json
          retention-days: 30
      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "ghcr.io/${{ github.repository }}:main"
