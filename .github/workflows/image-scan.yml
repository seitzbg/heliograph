# Scheduled re-scan of the published :main image, so a CVE newly disclosed against the pinned
# (unchanged) base images is still caught between merges. Report-only (continue-on-error) — it
# surfaces findings without failing on a pre-existing base-image CVE. Can also be run on demand.
name: image-scan

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan-main:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull :main
        run: docker pull "ghcr.io/${{ github.repository }}:main"
      - name: SBOM (syft)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.19.0 "docker:ghcr.io/${{ github.repository }}:main" \
            -o spdx-json > sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-main
          path: sbom.spdx.json
          retention-days: 30
      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "ghcr.io/${{ github.repository }}:main"
